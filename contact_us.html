<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiBoost</title>
    
    <!-- box icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <!-- Written external css -->
    <link rel="stylesheet" href="index.css">

</head>
<body>
    <!-- header design -->
    <header class="header">
        <a href="index.html" class="logo">DigiBoost</a>

        <i class='bx bx-menu' id="menu-icon"></i>
        
        <nav class="navbar">
            <a href="index.html" class="active">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="contact_us.html">Contact</a>
        </nav>

    </header>


    <!--contact section design-->
    <section class="contact" id="contact">
        <h2 class="heading">Contact <span>Us</span></h2>

        <form action="#">
            <div class="input-box">
                <input type="text" placeholder="First Name">
                <input type="text" placeholder="Last Name"> 
            </div>
            <div class="input-box">
                <input type="number" placeholder="Mobile Number">
                <input type="email" placeholder="E-mail">
            </div>
            <textarea name="" id="" cols="30" rows="10" placeholder="Your Message"></textarea>
            <input type="submit" value="Send Message" class="btn">
        </form>
    </section>


    <!--footer design-->
    <footer class="footer">
        <div class="footer-text">
            <p>Copyright & copy; by Skyline | All Rights Reserved.
                <br>Designed By-Ansh Khantwal
            </p>
        </div>

        <div class="footer-iconTop">
            <a href="contact_us.html"><i class='bx bx-up-arrow-alt'></i></a>
        </div>
    </footer>

    <!-- scroll reveal -->
    <script src="https://unpkg.com/scrollreveal"></script>

    <!-- types js-->
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>

    <!-- written file js -->
    <script src="script.js"></script>
</body>
</html>
